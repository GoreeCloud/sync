name: GoreeCloud Sync checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go test -race ./internal/...
      - run: go vet ./internal/...
  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Install development headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libxxf86vm-dev xvfb xauth
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o /tmp/goreecloud-sync ./cmd/goreecloud-sync

      - name: Native startup check
        run: sh scripts/linux-native-window-smoke.sh /tmp/goreecloud-sync
